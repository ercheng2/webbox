name: Build WebBox
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install
      run: pip install pywebview pyinstaller keyboard
    - name: Build
      run: pyinstaller --onefile --noconsole --name WebBox --icon Kunzhancheng.ico --noupx main.py
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v3.17-${{ github.run_number }}
        name: "WebBox v3.17 - 多实例独立配置"
        body: |
          更新内容：
          - 新增配置文件路径设置，支持多实例打开不同网页
          - F1设置窗口可指定配置文件保存位置
          - 支持 --config 命令行参数指定配置文件
          - F1=打开设置窗口 | F5=刷新当前页面
        files: dist/WebBox.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
