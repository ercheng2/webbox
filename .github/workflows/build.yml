name: Build WebBox
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install
      run: pip install pywebview pyinstaller keyboard
    - name: Build WebBox
      run: pyinstaller --onefile --noconsole --name WebBox --icon Kunzhancheng.ico --noupx main.py
    - name: Build KeyGen
      run: pyinstaller --onefile --noconsole --name WebBox-KeyGen --icon Kunzhancheng.ico --noupx webbox_keygen.py
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v3.20-${{ github.run_number }}
        name: "WebBox v3.20 - 授权版"
        body: |
          更新内容：
          - 新增软件授权系统（30天试用期 + 机器码绑定永久授权）
          - 防时间篡改：改本地时间、断网都无法绕过试用期
          - 含 WebBox.exe（客户版）与 WebBox-KeyGen.exe（注册机）
          - F1=打开设置窗口 | F5=刷新当前页面
        files: |
          dist/WebBox.exe
          dist/WebBox-KeyGen.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}