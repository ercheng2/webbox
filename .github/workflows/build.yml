name: Build WebBox
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        clean: true
    - uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install
      run: pip install pywebview pyinstaller keyboard
    - name: Build WebBox
      run: pyinstaller --onefile --noconsole --clean --name WebBox --icon Kunzhancheng.ico --noupx main.py
    - name: Build KeyGen
      run: pyinstaller --onefile --noconsole --clean --name WebBox-KeyGen --icon Kunzhancheng.ico --noupx webbox_keygen.py
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v3.24-${{ github.run_number }}
        name: "WebBox v3.24 - 软件授权版"
        body: |
          更新内容：
          - 🔒 新增软件授权：30天试用 + 机器码绑定硬件永久授权 + 防改时间/断网绕过
          - 🖥 多显示器支持：可指定窗口在哪个显示器打开
          - 🧩 浮动按钮调取本机 EXE：网页上可拖拽按钮，点击启动指定程序
          - F1=打开设置 | F5=刷新页面
          - 附 WebBox-KeyGen.exe（注册机），根据机器码生成激活码
        files: |
          dist/WebBox.exe
          dist/WebBox-KeyGen.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}