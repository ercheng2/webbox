name: Build WebBox
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        clean: true
    - uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install
      run: pip install pywebview pyinstaller keyboard
    - name: Build
      run: pyinstaller --onefile --noconsole --clean --name WebBox --icon Kunzhancheng.ico --noupx main.py
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v3.20-${{ github.run_number }}
        name: "WebBox v3.20 - 多显示器支持"
        body: |
          更新内容：
          - 🖥 新增显示器选择：可指定窗口在哪个显示器打开（显示器1/显示器2）
          - 设置界面自动检测所有显示器并显示分辨率
          - 全屏和非全屏模式均支持指定显示器
          - F1=打开设置窗口 | F5=刷新当前页面
        files: dist/WebBox.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}